<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRATE NIGHT</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#050505;color:#fff;font-family:Inter,system-ui,sans-serif}.glass{background:#101010d9;border:1px solid #d4af3733;backdrop-filter:blur(14px)}.gold-text{background:linear-gradient(90deg,#fff0a8,#D4AF37,#fff0a8);-webkit-background-clip:text;background-clip:text;color:transparent}.page{display:none}.page.active{display:block}.status{border-radius:999px;padding:.25rem .65rem;font-size:.75rem;font-weight:700}.pending{background:#d4af3722;color:#D4AF37}.approved{background:#16a34a22;color:#4ade80}.rejected{background:#ef444422;color:#f87171}.field{width:100%;background:#050505;border:1px solid #ffffff1a;border-radius:.75rem;padding:1rem;outline:none;color:white}.field:focus{border-color:#D4AF37}</style></head><body><header class="fixed top-0 inset-x-0 z-50 bg-black/85 backdrop-blur border-b border-white/10"><nav class="max-w-7xl mx-auto px-5 py-4 flex justify-between items-center"><button class="font-extrabold tracking-[.2em] gold-text" onclick="show('home')">CRATE NIGHT</button><div class="flex gap-3"><button onclick="show('login')" class="px-4 py-2 text-sm">Login</button><button onclick="show('register')" class="px-4 py-2 rounded-lg bg-[#D4AF37] text-black font-bold text-sm">Register</button></div></nav></header><main class="pt-20"><section id="home" class="page active"><div class="max-w-7xl mx-auto px-5 py-24"><h1 class="text-5xl md:text-7xl font-extrabold">Build. Manage.<br><span class="gold-text">Grow with confidence.</span></h1><p class="text-gray-400 text-lg mt-7">Accounts, applications, approvals and member operations in one secure workspace.</p><div class="flex gap-4 mt-9"><button onclick="show('register')" class="bg-[#D4AF37] text-black font-bold rounded-xl px-7 py-4">Create Account</button><button onclick="show('login')" class="border border-[#d4af3766] rounded-xl px-7 py-4">Sign In</button></div></div></section><section id="register" class="page max-w-xl mx-auto px-5 py-16"><div class="glass rounded-3xl p-8"><button onclick="show('home')">← Back</button><h2 class="text-4xl font-bold mt-7">Create account</h2><form id="registerForm" class="space-y-4 mt-8"><input id="regName" required class="field" placeholder="Full name"><input id="regEmail" required type="email" class="field" placeholder="Email"><input id="regPassword" required minlength="6" type="password" class="field" placeholder="Password (6+ characters)"><button class="w-full bg-[#D4AF37] text-black font-bold rounded-xl p-4">Create Account</button></form></div></section><section id="login" class="page max-w-xl mx-auto px-5 py-16"><div class="glass rounded-3xl p-8"><button onclick="show('home')">← Back</button><h2 class="text-4xl font-bold mt-7">Sign in</h2><form id="loginForm" class="space-y-4 mt-8"><input id="loginEmail" required type="email" class="field" placeholder="Email"><input id="loginPassword" required type="password" class="field" placeholder="Password"><button class="w-full bg-[#D4AF37] text-black font-bold rounded-xl p-4">Sign In</button></form></div></section><section id="dashboard" class="page max-w-6xl mx-auto px-5 py-16"><h2 class="text-4xl font-bold">Welcome, <span id="dashName">Member</span></h2><p id="dashEmail" class="text-gray-500 mt-2"></p><button onclick="logout()" class="mt-5 border border-[#d4af3766] rounded-xl px-5 py-3">Sign out</button><div class="grid lg:grid-cols-2 gap-6 mt-10"><div class="glass rounded-2xl p-7"><h3 class="text-2xl font-bold">New Application</h3><form id="applicationForm" class="space-y-4 mt-6"><input id="appPhone" class="field" placeholder="Phone"><textarea id="appPurpose" required class="field min-h-32" placeholder="Application purpose"></textarea><button class="w-full bg-[#D4AF37] text-black font-bold rounded-xl p-4">Submit Application</button></form></div><div class="glass rounded-2xl p-7"><h3 class="text-2xl font-bold">My Applications</h3><div id="myApplications" class="space-y-3 mt-6"></div></div></div></section><section id="admin" class="page max-w-6xl mx-auto px-5 py-16"><div class="flex justify-between"><div><p class="text-[#D4AF37] text-sm font-bold">SECURE ADMIN</p><h2 class="text-4xl font-bold mt-2">Application Review</h2></div><button onclick="logout()" class="border border-[#d4af3766] rounded-xl px-5 py-3">Sign out</button></div><div id="pendingApplications" class="grid md:grid-cols-2 gap-5 mt-10"></div></section></main><div id="toast" class="fixed bottom-5 right-5 glass rounded-xl px-5 py-4 hidden"></div><script type="module">import{auth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,updateProfile}from'./firebase.js';import{submitApplication,watchMyApplications,watchPendingApplications,reviewApplication}from'./application.js';const pages=['home','register','login','dashboard','admin'];let stopMine=()=>{},stopPending=()=>{};window.show=id=>{pages.forEach(x=>document.getElementById(x).classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)};function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3500)}function err(e){toast(e.message||'কাজটি সম্পন্ন হয়নি।')}function safe(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.logout=async()=>{await signOut(auth);show('home')};window.loadMyApplications=()=>{stopMine();stopMine=watchMyApplications(list=>{const box=document.getElementById('myApplications');box.innerHTML=list.length?list.map(a=>`<article class="bg-white/5 border border-white/10 rounded-xl p-4"><div class="flex justify-between gap-3"><b>${safe(a.purpose||'Application')}</b><span class="status ${safe(a.status||'pending')}">${safe(a.status||'pending')}</span></div><p class="text-gray-500 text-sm mt-2">${a.reviewNote?safe(a.reviewNote):'Awaiting review'}</p></article>`).join(''):'<p class="text-gray-500">No applications yet.</p>'})};function renderPending(list){const box=document.getElementById('pendingApplications');box.innerHTML=list.length?list.map(a=>`<article class="glass rounded-2xl p-6"><div class="flex justify-between"><b>${safe(a.name||'Member')}</b><span class="status pending">pending</span></div><p class="text-gray-400 mt-3">${safe(a.purpose||'')}</p><p class="text-xs text-gray-500 mt-2">${safe(a.applicantEmail||'')}</p><textarea id="note-${safe(a.id)}" class="field mt-4" placeholder="Review note"></textarea><div class="flex gap-3 mt-3"><button data-action="approve" data-id="${safe(a.id)}" class="flex-1 bg-green-600 rounded-xl p-3 font-bold">Approve</button><button data-action="reject" data-id="${safe(a.id)}" class="flex-1 bg-red-600 rounded-xl p-3 font-bold">Reject</button></div></article>`).join(''):'<p class="text-gray-500">No pending applications.</p>'}document.getElementById('registerForm').onsubmit=async e=>{e.preventDefault();try{const r=await createUserWithEmailAndPassword(auth,regEmail.value.trim(),regPassword.value);await updateProfile(r.user,{displayName:regName.value.trim()});toast('Account তৈরি হয়েছে।');show('dashboard')}catch(x){err(x)}};document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,loginEmail.value.trim(),loginPassword.value);toast('Login successful.')}catch(x){err(x)}};document.getElementById('applicationForm').onsubmit=async e=>{e.preventDefault();try{await submitApplication({phone:appPhone.value.trim(),purpose:appPurpose.value.trim()});appPhone.value='';appPurpose.value='';toast('Application submitted.');loadMyApplications()}catch(x){err(x)}};document.getElementById('pendingApplications').onclick=async e=>{const b=e.target.closest('button[data-action]');if(!b)return;try{await reviewApplication(b.dataset.id,b.dataset.action==='approve'?'approved':'rejected','');toast('Application updated.')}catch(x){err(x)}};onAuthStateChanged(auth,async user=>{if(!user){stopMine();stopPending();return}document.getElementById('dashName').textContent=user.displayName||'Member';document.getElementById('dashEmail').textContent=user.email||'';show('dashboard');loadMyApplications();const token=await user.getIdTokenResult(true);const isAdmin=token.claims.admin===true||user.email?.toLowerCase()==='cratenight@gmail.com';if(isAdmin){show('admin');stopPending=watchPendingApplications(renderPending)}});</script></body></html>
